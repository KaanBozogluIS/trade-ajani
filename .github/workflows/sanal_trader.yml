name: Sanal Trader

# NE YAPAR: kaan_trade_panel/sanal_trader.py'yi periyodik olarak (saatte bir)
# TEK SEFERLIK modda calistirir (--once), sonuclari (portfoy, pozisyonlar,
# islem/rotasyon gecmisi) depoya geri yazar. Boylece bilgisayariniz kapali
# olsa bile sistem calismaya devam eder -- GitHub'in kendi sunuculari
# calistirir.
#
# GERCEK PARA / API ANAHTARI YOK: bu is akisinda hicbir borsa API
# anahtari, sifre ya da hesap bilgisi kullanilmiyor -- sanal_trader.py
# sadece HERKESE ACIK piyasa verisini okuyor (bkz. veri_kaynaklari.py).
#
# NOT: bu depoda AYRICA "Canli Sinyal Taramasi" (live_scan.yml) her 5
# dakikada bir otomatik commit atiyor -- ayni depoda 2. bir otomatik-
# commit isi oldugu icin, push'tan once pull --rebase + retry dongusu
# kullaniyoruz (fetch_oi.yml'de daha once uygulanan ayni kalip).

on:
  schedule:
    # Her saat 5. dakikada -- tam saat basinda (00) degil, GitHub'in
    # yogunlugu dagitmak icin onerdigi gibi birkac dakika kaydirilmis.
    - cron: "5 * * * *"
  workflow_dispatch: {}   # Actions sekmesinden elle de tetiklenebilsin

permissions:
  contents: write   # sonuclari depoya geri commitleyebilmek icin

concurrency:
  group: sanal-trader
  cancel-in-progress: false   # bir calisma surerken yenisi baslarsa, ONCEKI iptal edilmez, SIRAYA girer

jobs:
  calistir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kaan_trade_panel
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      # 7/24 sunucu (scripts/sunucu_7x24.py) calisiyorsa bu turu atla --
      # sunucu durursa GitHub otomatik olarak yedek gorevine doner.
      - name: Sunucu calisiyor mu?
        id: nabiz
        working-directory: .
        run: python3 scripts/sunucu_nabzi_taze_mi.py

      - name: Python kur
        if: steps.nabiz.outputs.atla != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutuphaneleri kur
        if: steps.nabiz.outputs.atla != 'true'
        run: pip install -r requirements-sanal-trader.txt

      - name: Sanal trader'i bir tur calistir
        if: steps.nabiz.outputs.atla != 'true'
        env:
          # Islem/saglik bildirimleri icin (live_scan.yml ile AYNI bot/sohbet).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sanal_trader.py --once

      - name: Sonuclari depoya kaydet
        if: always() && steps.nabiz.outputs.atla != 'true'
        # git pull --rebase + retry: bu checkout is basladiginda alinmisti
        # (dakikalar once) -- o zamandan beri baska bir push (live_scan.yml
        # ya da elle yapilan bir push) gelmis olabilir. Once pull etmeden
        # push etmek "fetch first" hatasiyla TUM isi basarisiz kilar --
        # rebase, kendi commit'imizi en guncel halin UZERINE tasir, birkac
        # kez denenirse cakisma riski neredeyse sifira iner.
        run: |
          git config user.name "sanal-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cikti/sanal_trader/
          git diff --staged --quiet || git commit -m "Sanal trader guncellemesi $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main -q && git push && break
            echo "push basarisiz, tekrar deneniyor ($i/5)..."
            sleep $((i * 5))
          done

      - name: Saglik kontrolu (veri yoksa calismayi BASARISIZ isaretle)
        if: steps.nabiz.outputs.atla != 'true'
        # 2026-09-26 - 10-04 arasi bot mum verisi alamadi ama HER calisma
        # "basarili" (yesil) gorundu -- 8 gun kimse fark etmedi. Artik veri
        # alinamazsa bu adim kirmizi olur ve GitHub depo sahibine e-posta
        # bildirimi gonderir. Sonuclar yukarida ZATEN kaydedildi (if: always).
        run: |
          python -c "
          import json, sys
          s = json.load(open('cikti/sanal_trader/saglik.json', encoding='utf-8'))
          print(json.dumps(s, indent=2, ensure_ascii=False))
          sys.exit(0 if s.get('mum_verisi_ok') else 1)
          "
