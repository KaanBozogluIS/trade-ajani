name: Canli Sinyal Taramasi

# Laptop kapaliyken de calisir - GitHub'in kendi sunucularinda, ucretsiz.
# Her 5 dakikada bir watchlist'i kontrol eder, sinyal DEGISTIYSE Telegram'a
# bildirim atar. Ayni sinyali tekrar tekrar gondermemek icin son durumu
# (data/state/last_signal.json) her calistirmadan sonra repoya geri yazar.
# NOT: 5 dakikalik siklik private repo'larda aylik ucretsiz Actions kotasini
# (2000 dk) asar - bu yuzden repo bilincli olarak public yapildi (Actions
# dakikasi public repo'larda sinirsiz/ucretsiz). Gercek kimlik bilgileri
# (.env, TELEGRAM_BOT_TOKEN/CHAT_ID) hicbir zaman repoya commitlenmiyor,
# sadece GitHub Secrets'ta duruyor.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # GitHub'da "Run workflow" ile elle de tetiklenebilir

permissions:
  contents: write  # last_signal.json'u geri commitleyebilmek icin

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 7/24 sunucu (scripts/sunucu_7x24.py) calisiyorsa bu turu atla --
      # sunucu durursa GitHub otomatik olarak yedek gorevine doner.
      - name: Sunucu calisiyor mu?
        id: nabiz
        run: python3 scripts/sunucu_nabzi_taze_mi.py

      - uses: actions/setup-python@v5
        if: steps.nabiz.outputs.atla != 'true'
        with:
          python-version: "3.12"

      - if: steps.nabiz.outputs.atla != 'true'
        run: pip install -r requirements.txt

      - name: Sinyalleri kontrol et, degisen varsa Telegram'a gonder
        if: steps.nabiz.outputs.atla != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/live_scan.py

      - name: Sinyal durumunu repoya geri yaz
        if: steps.nabiz.outputs.atla != 'true'
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add data/state/last_signal.json
          git diff --staged --quiet || git commit -m "sinyal durumu guncellendi [skip ci]"
          # Ayni depoya sanal_trader.yml de commit atiyor -- once pull etmeden
          # push etmek "fetch first" hatasiyla basarisiz olur ve sinyal durumu
          # kaybolur (bir sonraki taramada AYNI sinyal tekrar gonderilir).
          for i in 1 2 3 4 5; do
            git pull --rebase origin main -q && git push && break
            echo "push basarisiz, tekrar deneniyor ($i/5)..."
            sleep $((i * 5))
          done
